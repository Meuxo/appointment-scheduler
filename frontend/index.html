<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 id="title">Log In</h1>

    <form id="form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="submit">Log In</button>
    </form>

    <p id="message" class="message"></p>

    <p class="switch">
      <span id="switch-text">Don't have an account?</span>
      <a href="#" id="switch-link">Create account</a>
    </p>
  </main>

  <script>
    let creating = false;

    document.getElementById("switch-link").addEventListener("click", (e) => {
      e.preventDefault();
      creating = !creating;
      document.getElementById("title").textContent = creating ? "Create Account" : "Log In";
      document.getElementById("submit").textContent = creating ? "Create Account" : "Log In";
      document.getElementById("switch-text").textContent = creating ? "Already have an account?" : "Don't have an account?";
      document.getElementById("switch-link").textContent = creating ? "Log in" : "Create account";
      document.getElementById("message").textContent = "";
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("message");
      const res = await fetch(creating ? "/api/register" : "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        message.textContent = data.detail;
        message.className = "message error";
      } else if (creating) {
        document.getElementById("switch-link").click();
        message.textContent = "Account created! You can log in now.";
        message.className = "message";
      } else {
        localStorage.setItem("user", JSON.stringify(data));
        window.location.href = "home.html";
      }
    });
  </script>
</body>
</html>
