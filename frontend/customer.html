<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Book an Appointment</h1>
    <button class="link" onclick="logout()">Log Out</button>
  </header>

  <main>
    <section class="card">
      <h2>Pick a Day</h2>
      <input type="date" id="date">
      <div id="slots" class="slots"></div>
      <p id="book-message" class="message"></p>
    </section>

    <section class="card">
      <h2>My Upcoming Appointments</h2>
      <ul id="my-appointments"></ul>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const user = requireLogin();
    const dateInput = document.getElementById("date");
    dateInput.value = new Date().toISOString().slice(0, 10);

    async function loadSlots() {
      const slots = await api(`/api/slots?date=${dateInput.value}`);
      const box = document.getElementById("slots");
      box.innerHTML = slots.length ? "" : "<p>No open times this day.</p>";
      slots.forEach((time) => {
        const btn = document.createElement("button");
        btn.textContent = time;
        btn.onclick = () => book(time);
        box.appendChild(btn);
      });
    }

    async function book(time) {
      try {
        const res = await api("/api/appointments", "POST", { user_id: user.id, date: dateInput.value, time });
        showMessage("book-message", res.message);
      } catch (err) {
        showMessage("book-message", err.message, true);
      }
      loadSlots();
      loadMyAppointments();
    }

    async function loadMyAppointments() {
      const list = document.getElementById("my-appointments");
      const appts = await api(`/api/appointments?user_id=${user.id}`);
      list.innerHTML = appts.length ? "" : "<li>No upcoming appointments.</li>";
      appts.forEach((a) => {
        const li = document.createElement("li");
        li.textContent = `${a.date} at ${a.time} `;
        const btn = document.createElement("button");
        btn.textContent = "Cancel";
        btn.onclick = async () => {
          await api(`/api/appointments/${a.id}?user_id=${user.id}`, "DELETE");
          loadSlots();
          loadMyAppointments();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    dateInput.addEventListener("change", loadSlots);
    loadSlots();
    loadMyAppointments();
  </script>
</body>
</html>
