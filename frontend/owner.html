<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Hours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Business Hours</h1>
    <button class="link" onclick="logout()">Log Out</button>
  </header>

  <main>
    <section class="card">
      <h2>Set Hours</h2>
      <form id="hours-form">
        <select id="day">
          <option value="0">Monday</option>
          <option value="1">Tuesday</option>
          <option value="2">Wednesday</option>
          <option value="3">Thursday</option>
          <option value="4">Friday</option>
          <option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
        <label>Open <input type="time" id="open" value="09:00" required></label>
        <label>Close <input type="time" id="close" value="17:00" required></label>
        <button type="submit">Save</button>
      </form>
      <p id="hours-message" class="message"></p>
    </section>

    <section class="card">
      <h2>Current Hours</h2>
      <ul id="hours-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const user = requireLogin();
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    async function loadHours() {
      const hours = await api("/api/hours");
      const list = document.getElementById("hours-list");
      list.innerHTML = hours.length ? "" : "<li>No hours set yet.</li>";
      hours.forEach((h) => {
        const li = document.createElement("li");
        li.textContent = `${DAYS[h.day_of_week]}: ${h.open_time} to ${h.close_time} `;
        const btn = document.createElement("button");
        btn.textContent = "Close this day";
        btn.onclick = async () => {
          await api(`/api/hours/${h.day_of_week}?user_id=${user.id}`, "DELETE");
          loadHours();
        };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    document.getElementById("hours-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await api("/api/hours", "POST", {
          user_id: user.id,
          day_of_week: Number(document.getElementById("day").value),
          open_time: document.getElementById("open").value,
          close_time: document.getElementById("close").value,
        });
        showMessage("hours-message", "Hours saved");
        loadHours();
      } catch (err) {
        showMessage("hours-message", err.message, true);
      }
    });

    loadHours();
  </script>
</body>
</html>
